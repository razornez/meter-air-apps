# Auto-deploy API NestJS ke VPS — pola sama dgn web admin (appleboy/ssh-action).
# Trigger hanya saat folder API berubah (push mobile-only tidak ikut deploy).
#
# WAJIB set Secrets di repo meter-air-apps (Settings → Secrets → Actions):
#   DEPLOY_HOST  = IP VPS
#   DEPLOY_USER  = user SSH (yang punya akses ke /var/www/meter-air-api)
#   DEPLOY_KEY   = private key SSH
# Dan di VPS: user tsb punya sudo NOPASSWD untuk: systemctl restart meter-air-api
name: Deploy API to VPS

on:
  push:
    branches: [main]
    paths:
      - 'refactor/api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            # Repo dimiliki www-data; tandai aman agar git tak tolak "dubious ownership".
            git config --global --add safe.directory /var/www/meter-air-api
            cd /var/www/meter-air-api
            # Fetch + reset --hard (pola sama web admin) — hindari konflik merge.
            git fetch origin main
            git reset --hard origin/main
            cd refactor/api
            npm ci
            npm run build
            sudo node scripts/repair-api-env.mjs
            sudo cp deploy/meter-air-api.service /etc/systemd/system/meter-air-api.service
            sudo systemctl daemon-reload
            sudo systemctl restart meter-air-api
            for i in $(seq 1 45); do
              if curl --fail --silent http://127.0.0.1:4010/api/health >/tmp/meter-air-api-health.json; then
                cat /tmp/meter-air-api-health.json
                echo
                break
              fi
              if [ "$i" = "45" ]; then
                echo "API did not become ready on 127.0.0.1:4010"
                sudo systemctl status meter-air-api --no-pager || true
                sudo journalctl -u meter-air-api -n 120 --no-pager || true
                sudo tail -n 160 /var/log/meter-air-api/out.log || true
                sudo tail -n 160 /var/log/meter-air-api/err.log || true
                exit 1
              fi
              echo "Waiting for API on 127.0.0.1:4010 ($i/45)..."
              sleep 2
            done
            if sudo test -f /etc/letsencrypt/live/api.meterair.online/fullchain.pem && sudo test -f /etc/letsencrypt/live/api.meterair.online/privkey.pem; then
              sudo tee /etc/nginx/sites-available/api.meterair.online >/dev/null <<'NGINX'
            server {
                listen 80;
                listen [::]:80;
                server_name api.meterair.online;

                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name api.meterair.online;

                ssl_certificate /etc/letsencrypt/live/api.meterair.online/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/api.meterair.online/privkey.pem;

                client_max_body_size 20M;

                location / {
                    proxy_pass http://127.0.0.1:4010;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX
            else
              sudo tee /etc/nginx/sites-available/api.meterair.online >/dev/null <<'NGINX'
            server {
                listen 80;
                listen [::]:80;
                server_name api.meterair.online;

                client_max_body_size 20M;

                location / {
                    proxy_pass http://127.0.0.1:4010;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX
              echo "HTTPS certificate for api.meterair.online not found; deployed HTTP-only API proxy"
            fi
            sudo ln -sf /etc/nginx/sites-available/api.meterair.online /etc/nginx/sites-enabled/api.meterair.online
            sudo nginx -t
            sudo systemctl reload nginx
            sudo systemctl status meter-air-api --no-pager || true
            sudo journalctl -u meter-air-api -n 80 --no-pager || true
            sudo tail -n 120 /var/log/meter-air-api/out.log || true
            sudo tail -n 120 /var/log/meter-air-api/err.log || true
            MAIN_PID="$(systemctl show -p MainPID --value meter-air-api || true)"
            echo "meter-air-api MainPID=${MAIN_PID}"
            if [ -n "$MAIN_PID" ] && [ "$MAIN_PID" != "0" ]; then ps -fp "$MAIN_PID" || true; fi
            ps -eo pid,ppid,cmd | grep '[n]ode' || true
            ss -ltnp | grep ':4010' || true
            curl --fail --show-error --silent http://127.0.0.1:4010/api/health
            if sudo test -f /etc/letsencrypt/live/api.meterair.online/fullchain.pem && sudo test -f /etc/letsencrypt/live/api.meterair.online/privkey.pem; then
              curl --fail --show-error --silent https://api.meterair.online/api/health
            else
              curl --fail --show-error --silent http://api.meterair.online/api/health
            fi
            echo "✅ API deployed at $(date)"

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[GAGAL] Deploy meter-air-api - ${{ github.sha }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deploy GAGAL!

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Commit message: ${{ github.event.head_commit.message }}
            Triggered by: ${{ github.actor }}

            Cek detail error di:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Notify on success
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[SUKSES] Deploy meter-air-api - ${{ github.sha }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deploy SUKSES!

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Commit message: ${{ github.event.head_commit.message }}
            Triggered by: ${{ github.actor }}

            Lihat detail di:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
