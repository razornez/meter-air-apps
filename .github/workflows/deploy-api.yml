# Auto-deploy API NestJS ke VPS — pola sama dgn web admin (appleboy/ssh-action).
# Trigger hanya saat folder API berubah (push mobile-only tidak ikut deploy).
#
# WAJIB set Secrets di repo meter-air-apps (Settings → Secrets → Actions):
#   DEPLOY_HOST  = IP VPS
#   DEPLOY_USER  = user SSH (yang punya akses ke /var/www/meter-air-api)
#   DEPLOY_KEY   = private key SSH
# Dan di VPS: user tsb punya sudo NOPASSWD untuk: systemctl restart meter-air-api
name: Deploy API to VPS

on:
  push:
    branches: [main]
    paths:
      - 'refactor/api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            # Repo dimiliki www-data; tandai aman agar git tak tolak "dubious ownership".
            git config --global --add safe.directory /var/www/meter-air-api
            cd /var/www/meter-air-api
            # Fetch + reset --hard (pola sama web admin) — hindari konflik merge.
            git fetch origin main
            git reset --hard origin/main
            cd refactor/api
            npm ci
            npm run build
            sudo systemctl restart meter-air-api
            echo "✅ API deployed at $(date)"

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[GAGAL] Deploy meter-air-api - ${{ github.sha }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deploy GAGAL!

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Commit message: ${{ github.event.head_commit.message }}
            Triggered by: ${{ github.actor }}

            Cek detail error di:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
